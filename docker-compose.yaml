services:
  get_iplayer:
    image: docker-get_iplayer:local
    build:
      context: .
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-100}"
      PORT: "1935"
      BASEURL: "${BASEURL:-}"
      WEB_TOKEN: "${WEB_TOKEN:-}"
    volumes:
      - ${OUTPUT_DIR:-./output}:/output
    ports:
      - "127.0.0.1:${WEB_PORT:-1935}:1935"
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
